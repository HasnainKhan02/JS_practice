<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AURA — Premium Tech Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===== NAV ===== -->
    <nav>
        <div class="logo">AURA</div>
        <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search products…" id="searchInput">
        </div>
        <nav class="nav-actions">
            <button class="nav-btn" id="cartNavBtn" title="Cart">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
            <button class="nav-btn menu-btn" id="menuBtn">
                <i class="fa-solid fa-bars" id="menuIcon"></i>
            </button>
        </nav>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="#">Home</a>
        <a href="#">Deals</a>
        <a href="#">New Arrivals</a>
        <a href="#">Delivery</a>
        <input class="mobile-search" type="text" placeholder="Search…" id="mobileSearch">
    </div>

    <!-- ===== HERO ===== -->
    <div class="hero">
        <div class="hero-banner">
            <div class="hero-slides" id="heroSlides"></div>
            <div class="hero-overlay">
                <span class="hero-tag">New Collection</span>
                <h1 class="hero-title">Sound Without<br>Compromise</h1>
                <p class="hero-sub">Premium audio gear for every moment</p>
                <button class="hero-cta">Shop Now →</button>
            </div>
            <div class="hero-dots" id="heroDots"></div>
        </div>
    </div>

    <!-- ===== FILTERS ===== -->
    <div class="filter-section">
        <button class="filter-chip active" data-cat="all">All</button>
        <button class="filter-chip" data-cat="audio">Audio</button>
        <button class="filter-chip" data-cat="wearables">Wearables</button>
        <button class="filter-chip" data-cat="accessories">Accessories</button>
        <button class="filter-chip" data-cat="gaming">Gaming</button>
        <button class="sort-chip" id="sortBtn"><i class="fa-solid fa-arrow-up-wide-short"></i> Sort</button>
    </div>

    <!-- ===== PRODUCTS ===== -->
    <div class="section-head">
        <h2>Featured Drops</h2>
        <span id="productCount"></span>
    </div>
    <div class="product-grid" id="productGrid"></div>

    <!-- ===== PRODUCT MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-sheet" id="modalSheet">
            <div class="modal-handle"></div>
            <div class="modal-body">
                <div class="modal-img"><img id="modalImg" src="" alt=""></div>
                <div class="modal-info">
                    <div class="modal-tag" id="modalTag"></div>
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <p class="modal-desc" id="modalDesc"></p>
                    <div class="modal-stars">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                        <span>4.0 (128 reviews)</span>
                    </div>
                    <div class="modal-price-row">
                        <div class="modal-price" id="modalPrice"></div>
                        <div class="stock-pill">Only 12 Left!</div>
                    </div>
                    <div class="qty-row">
                        <div class="qty-box">
                            <button id="modalMinus">−</button>
                            <span id="modalQty">1</span>
                            <button id="modalPlus">+</button>
                        </div>
                        <span style="font-size:.82rem;color:var(--muted);">Qty</span>
                    </div>
                    <div class="modal-actions">
                        <button class="btn-buy">Buy Now</button>
                        <button class="btn-cart-modal" id="modalAddCart">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></div>
        </div>
    </div>

    <!-- ===== CART DRAWER ===== -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h2>Your Bag</h2>
            <div class="close-cart" id="closeCart"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <div class="cart-items-list" id="cartItemsList">
            <div class="cart-empty" id="cartEmpty">
                <i class="fa-solid fa-bag-shopping"></i>
                <p>Your bag is empty</p>
            </div>
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span class="label">Total</span>
                <span class="total" id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn">Checkout →</button>
        </div>
    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <button class="bottom-btn active"><i class="fa-solid fa-house"></i>Home</button>
        <button class="bottom-btn"><i class="fa-solid fa-magnifying-glass"></i>Search</button>
        <button class="bottom-btn" id="cartBottomBtn">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>Cart</span>
        </button>
        <button class="bottom-btn"><i class="fa-regular fa-user"></i>Account</button>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">Added to bag!</div>

    <script src="script.js">

    </script>
</body>

</html>
