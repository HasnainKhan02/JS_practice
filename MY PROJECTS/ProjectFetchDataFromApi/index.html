<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store Products</title>
    <style>
        .box {
            max-height: 600px;
            width: 100%;
            border: 1px solid black;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 10px;
            overflow: auto;
            justify-content: center;
        }

        .boxes {
            min-width: 180px;
            max-width: 220px;
            border: 1px solid black;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        }

        .boxes img {
            height: 120px;
            width: 120px;
            border-radius: 10px;
            object-fit: contain;
        }

        .boxes {
            transition: transform 0.3s ease;
            /* Smooth scaling */
        }

        .boxes:hover {
            transform: scale(1.1);
            /* Scale up 10% */
        }

        .boxes h4 {
            font-size: 14px;
            height: 40px;
            overflow: hidden;
        }

        .boxes span {
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>
    <div class="box"></div>

    <script>
        async function getProducts() {
            try {
                let res = await fetch("https://fakestoreapi.com/products");
                let products = await res.json();

                const container = document.querySelector(".box");
                let html = "";

                products.forEach(product => {
                    html += `
                    <div class="boxes">
                        <img src="${product.image}" alt="${product.title}">
                        <h4>${product.title}</h4>
                        <span>$${product.price}</span>
                        <p>Rating: ${product.rating.rate} ⭐</p>
                        <p>Count: ${product.rating.count}</p>
                    </div>`;
                });

                container.innerHTML = html;
            } catch (error) {
                console.error("Error fetching products:", error);
            }
        }

        getProducts();
    </script>
</body>

</html>
