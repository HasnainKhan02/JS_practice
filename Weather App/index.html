<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00bcd4">
</head>

<body>
    <div class="weather">
        <div class="top">
            <div class="input">
                <input type="text" name="" id="" placeholder="Enter Your City Name">
                <div class="icon"><img src="images/search.png" alt=""></div>
            </div>
        </div>
        <div class="center">
            <div class="NameTime">
                <h1 class="city">Swabi</h1>
                <p id="day">Monday</p><span class="time">7:00 AM</span>
            </div>
            <div class="IMG">
                <img src="images/rain.png" alt="">
            </div>
            <div class="lower">
                <h2 class="unit">22 °C</h2>
                <div class="morning">GOOD MORNING</div>
                <div class="wthr">WARM</div>
            </div>
        </div>
        <!-- Footer -->
        <footer>

            <div class="footer">
                <div class="col1">
                    <img src="images/mist.png" alt="">
                    <p>SUNRISE</p>
                    <p class="time">7:00</p>
                </div>
                <div class="col1">
                    <img src="images/wind.png" alt="" id="windImg">
                    <p>WIND</p>
                    <p class="wind">4m/s</p>
                </div>
                <div class="col1">
                    <img src="images/humidity.png" alt="" id="humidityImg">
                    <p>HUMIDITY</p>
                    <p class="humidity">23°</p>
                </div>
            </div>
        </footer>

    </div>
    <script src="script.js"></script>
</body>

</html>
